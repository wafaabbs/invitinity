<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jurnal | Invitinity</title>
  <meta name="description" content="Inspirasi, tips, dan cerita seputar undangan digital, undangan pernikahan, dan momen spesial dari Invitinity.">
  <meta name="theme-color" content="#151515">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%23151515'/%3E%3Cpath d='M12 12c-2-2.7-3.8-4-5.5-4a4 4 0 0 0 0 8c1.7 0 3.5-1.3 5.5-4Zm0 0c2 2.7 3.8 4 5.5 4a4 4 0 0 0 0-8c-1.7 0-3.5 1.3-5.5 4Z' fill='none' stroke='%23C9A45C' stroke-width='1.6'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link id="fontLink" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@300;400;500;600&display=swap">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-infinity" viewBox="0 0 24 24"><path d="M12 12c-2-2.7-3.8-4-5.5-4a4 4 0 0 0 0 8c1.7 0 3.5-1.3 5.5-4Zm0 0c2 2.7 3.8 4 5.5 4a4 4 0 0 0 0-8c-1.7 0-3.5 1.3-5.5 4Z" fill="none" stroke="currentColor" stroke-width="1.3"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-chat" viewBox="0 0 24 24"><path d="M12 3a9 9 0 0 0-7.8 13.5L3 21l4.6-1.2A9 9 0 1 0 12 3Z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M8.5 9.5c.3 2.6 3.4 5.6 6 6l1.2-1.4-1.9-1-1 .8c-1-.4-2.2-1.6-2.6-2.6l.8-1-1-1.9Z" fill="currentColor"/></symbol>
  </svg>

  <header class="nav nav--solid" id="nav">
    <div class="container nav__inner">
      <a href="index.html" class="logo" aria-label="Invitinity"><svg aria-hidden="true"><use href="#i-infinity"/></svg>INVITINITY</a>
      <ul class="nav__links">
        <li><a href="index.html#portfolio" data-i18n="nav.collection">Koleksi</a></li>
        <li><a href="index.html#packages" data-i18n="nav.packages">Paket</a></li>
        <li><a href="article.html" data-i18n="nav.articles">Artikel</a></li>
      </ul>
      <div class="nav__right">
        <div class="lang" role="group" aria-label="Language">
          <button type="button" data-lang="id">ID</button><button type="button" data-lang="en">EN</button><button type="button" data-lang="ms">MS</button>
        </div>
        <a href="index.html#create" class="btn btn--sm nav__cta" data-i18n="nav.cta">Buat Undanganmu</a>
      </div>
    </div>
  </header>

  <main class="article-page">
    <!-- List view -->
    <div class="container" id="listView" hidden>
      <div class="section-head">
        <span class="eyebrow" data-i18n="articles.eyebrow">Jurnal</span>
        <h1 class="h-section" data-i18n="page.articles.title">Jurnal</h1>
        <p class="lead" data-i18n="page.articles.lead">Inspirasi, tips, dan cerita seputar undangan dan momen spesial.</p>
      </div>
      <div class="grid-3" id="allPosts"></div>
    </div>

    <!-- Detail view -->
    <article class="article" id="detailView" hidden>
      <a href="article.html" class="article__back"><svg aria-hidden="true"><use href="#i-arrow"/></svg><span id="backLabel"></span></a>
      <time id="aDate" class="eyebrow"></time>
      <h1 id="aTitle"></h1>
      <p class="lead" id="aExcerpt"></p>
      <div class="article__cover" id="aCover" hidden></div>
      <div class="prose" id="aBody"></div>
      <aside class="article__cta">
        <h3 id="ctaTitle"></h3>
        <a href="#" class="btn" data-wa="wa.consult"><svg aria-hidden="true"><use href="#i-chat"/></svg> <span id="ctaBtn"></span></a>
      </aside>
    </article>
  </main>

  <footer class="footer">
    <div class="container footer__bottom" style="padding-top:0">
      <a href="index.html" class="logo"><svg aria-hidden="true"><use href="#i-infinity"/></svg>INVITINITY</a>
      <span>© <span data-year></span> Invitinity · <a data-ig-link href="https://www.instagram.com/invitinity" target="_blank" rel="noopener">Instagram</a></span>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/defaults.js"></script>
  <script src="assets/js/core.js"></script>
  <script src="assets/js/article.js"></script>
</body>
</html>
