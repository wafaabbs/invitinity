<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jurnal | Invitinity</title>
  <meta name="description" content="Inspirasi, tips, dan cerita seputar undangan digital, undangan pernikahan, dan momen spesial dari Invitinity.">
  <meta name="theme-color" content="#701c45">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23701c45'/%3E%3Ctext x='16' y='23' text-anchor='middle' font-family='Georgia,serif' font-style='italic' font-size='20' fill='%23ffffff'%3EI%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&display=swap">
  <link id="fontLink" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <!-- Coming Soon guard: hide the page until we know whether Coming Soon mode is on (see core.js). -->
  <script>(function(){var c='cs-wait';try{var s=JSON.parse(localStorage.getItem('inv_settings')||'null');if(s)c=s.coming_soon?'cs-on':'';}catch(e){}if(c)document.documentElement.classList.add(c);})();</script>
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-chev" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="i-globe" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3Z"/></g></symbol>
    <symbol id="i-chat" viewBox="0 0 24 24"><path d="M12 3a9 9 0 0 0-7.8 13.5L3 21l4.6-1.2A9 9 0 1 0 12 3Z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M8.5 9.5c.3 2.6 3.4 5.6 6 6l1.2-1.4-1.9-1-1 .8c-1-.4-2.2-1.6-2.6-2.6l.8-1-1-1.9Z" fill="currentColor"/></symbol>
    <symbol id="i-ig" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="17.3" cy="6.7" r="1.1" fill="currentColor"/></symbol>
  </svg>

  <div class="announce"><span data-i18n="bar.text">✦ Gratis custom nama domain untuk setiap undangan digital ✦</span></div>
  <header class="header" id="nav">
    <div class="container header__row" style="padding-bottom:14px">
      <div class="header__left">
        <div class="langsel" id="langsel" style="display:block">
          <button type="button" class="langsel__btn" aria-haspopup="true" aria-expanded="false"><svg><use href="#i-globe"/></svg><span data-lang-current>ID</span><svg class="chev"><use href="#i-chev"/></svg></button>
          <ul class="langsel__menu">
            <li><button type="button" data-lang="id">Bahasa Indonesia</button></li>
            <li><button type="button" data-lang="en">English</button></li>
            <li><button type="button" data-lang="ms">Bahasa Melayu</button></li>
          </ul>
        </div>
      </div>
      <a href="index.html" class="wordmark" aria-label="Invitinity"><span class="wordmark__name">Invitinity</span><span class="wordmark__tag">Invitation Studio</span></a>
      <div class="header__right">
        <a class="icon-btn" href="#" data-wa="wa.consult" aria-label="WhatsApp"><svg><use href="#i-chat"/></svg></a>
      </div>
    </div>
  </header>

  <main class="article-page">
    <!-- List view -->
    <div class="container" id="listView" hidden>
      <div class="head-center" style="text-align:left;justify-items:start">
                <h1 class="title" data-i18n="page.articles.title">Jurnal</h1>
        <p class="lead" data-i18n="page.articles.lead">Inspirasi, tips, dan cerita seputar undangan dan momen spesial.</p>
      </div>
      <div class="posts" id="allPosts"></div>
    </div>

    <!-- Detail view -->
    <article class="article" id="detailView" hidden>
      <a href="article.html" class="article__back"><svg aria-hidden="true"><use href="#i-arrow"/></svg><span id="backLabel"></span></a>
      <time id="aDate" class="eyebrow"></time>
      <h1 id="aTitle"></h1>
      <p class="lead" id="aExcerpt"></p>
      <div class="article__cover" id="aCover" hidden></div>
      <div class="prose" id="aBody"></div>
      <aside class="article__cta">
        <h3 id="ctaTitle"></h3>
        <a href="#" class="btn" data-wa="wa.consult"><svg><use href="#i-chat"/></svg> <span id="ctaBtn"></span></a>
      </aside>
    </article>
  </main>

  <div class="footer-band" aria-hidden="true">✦</div>
  <div class="footer-bottom">
    <div class="container">
      <span>© <span data-year></span> Invitinity · invitinity.my.id</span>
      <div class="socials">
        <a data-ig-link href="https://www.instagram.com/invitinity" target="_blank" rel="noopener" aria-label="Instagram"><svg><use href="#i-ig"/></svg></a>
        <a href="#" data-wa="wa.hello" aria-label="WhatsApp"><svg><use href="#i-chat"/></svg></a>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/defaults.js"></script>
  <script src="assets/js/core.js"></script>
  <script src="assets/js/track.js"></script>
  <script src="assets/js/article.js"></script>
</body>
</html>
